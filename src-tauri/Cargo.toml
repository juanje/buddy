[package]
name = "ab-app"
version = "0.1.0"
description = "Agentic Buddy — personal assistant with persistent memory"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-js = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ab-app"
path = "src/main.rs"
