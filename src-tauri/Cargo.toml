[package]
name = "buddy"
version = "0.1.49"
description = "Buddy — personal assistant with persistent memory"
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-js = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSURL", "NSError"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPDFConfiguration", "WKNavigationDelegate", "WKNavigation", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", features = ["NSView"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["PDFDocument", "PDFPage"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
block2 = "0.6"
dispatch = "0.2"

[[bin]]
name = "buddy"
path = "src/main.rs"
