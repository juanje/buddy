name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag must not publish anything the quality gate has not passed.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            label: macOS-ARM64
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            rust_target: ''
            label: Linux-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2

      - name: Install frontend dependencies
        run: npm ci

      # The notes are written and reviewed in the repo, not typed into the
      # GitHub UI after the fact. Every release up to v0.1.9 was published with
      # the placeholder body and edited by hand afterwards; v0.1.0 still carries
      # the leftover "Download the installer" line because of it.
      - name: Read release notes
        id: notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat "$notes"
            echo
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build sidecar
        env:
          BUDDY_BUILD_TARGET: ${{ matrix.rust_target || '' }}
        run: bash scripts/build-worker.sh

      # Ad-hoc sign on macOS when no Developer ID certificate is configured.
      # Without any signature, Gatekeeper shows the non-bypassable "damaged"
      # error. Ad-hoc signing (identity "-") downgrades this to the
      # bypassable "unidentified developer" warning (right-click → Open).
      # When APPLE_SIGNING_IDENTITY is set via repo secrets, Tauri uses
      # the real certificate instead and this default has no effect.
      - name: Build app with Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          tagName: v__VERSION__
          releaseName: 'Buddy v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
