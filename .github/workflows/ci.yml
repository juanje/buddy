name: CI

# The quality gate CLAUDE.md mandates before every commit, run where it cannot
# be skipped. Until now it lived only in a document, and release.yml published
# tags without running any of it.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      # On v7 after reading what each major changed. Two of them would matter to
      # a different repository, and neither reaches this one:
      #
      #   checkout v6  — persists credentials to a separate file. Relevant when
      #                  a later step runs git itself against the checkout; no
      #                  workflow here commits or pushes, and the only token use
      #                  is passed explicitly to tauri-action, which calls the
      #                  API.
      #   checkout v7  — refuses fork checkouts under `pull_request_target` and
      #                  `workflow_run`. Neither trigger is used. **Adding
      #                  either is the moment to re-read this**, since a fork PR
      #                  would then stop being checked out.
      #   setup-node   — v5 began caching automatically from a `packageManager`
      #                  field, v6 narrowed that to npm. This repo declares no
      #                  such field and sets `cache` explicitly below, so the
      #                  default never applies.
      #
      # What the pull request proved and what it did not: CI ran green on v7,
      # but a pull request never triggers release.yml, so the first run of the
      # installer build on these versions is the next tag.
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # Not redundant with tsc: tsc does not look inside .svelte, so this is the
      # only step that catches broken components and orphaned CSS.
      - name: Build
        run: npx vite build

      - name: Tests (unit + BDD)
        run: npm test

# Deliberately no "did the run leave stray processes behind" step. A
# `pgrep -f 'reflect-child|agent-worker'` sweep passes on a clean CI runner and
# fails on any developer machine with the app installed and open — it matches
# the shipped binary. A check that is green in one environment and red in
# another for reasons unrelated to the code is worse than no check. The
# deterministic guard is NFR-TEST-02, which fails inside the suite, at the call
# that caused it, in both environments.
