name: CI

# The quality gate CLAUDE.md mandates before every commit, run where it cannot
# be skipped. Until now it lived only in a document, and release.yml published
# tags without running any of it.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      # Held at v5 deliberately, not at latest. v5 is the release that moved
      # these actions off the node20 runtime GitHub is retiring, and it is the
      # last one that changes nothing else here:
      #
      #   checkout v6  — moves credentials to a separate file
      #   checkout v7  — refuses fork checkouts on pull_request_target
      #   setup-node   — v5 caches automatically when package.json declares
      #                  `packageManager`; this repo declares none and sets
      #                  `cache` explicitly below, so it is a no-op for us
      #
      # None of those are known to break this workflow; they are simply changes
      # that want reading before they land, which a runtime deprecation fix
      # should not smuggle in.
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # Not redundant with tsc: tsc does not look inside .svelte, so this is the
      # only step that catches broken components and orphaned CSS.
      - name: Build
        run: npx vite build

      - name: Tests (unit + BDD)
        run: npm test

# Deliberately no "did the run leave stray processes behind" step. A
# `pgrep -f 'reflect-child|agent-worker'` sweep passes on a clean CI runner and
# fails on any developer machine with the app installed and open — it matches
# the shipped binary. A check that is green in one environment and red in
# another for reasons unrelated to the code is worse than no check. The
# deterministic guard is NFR-TEST-02, which fails inside the suite, at the call
# that caused it, in both environments.
